# Настройки отчёта. Меняйте цифры под свою реальность — от них зависят все рекомендации.

[purchase]
lead_time_days = 45      # срок от заказа заводу до прихода на склад (производство + Китай + внешняя логистика)
safety_days = 14         # страховой запас на задержки
order_cycle_days = 30    # как часто вы размещаете заказы (на сколько дней берём товар сверх срока поставки)
overstock_days = 180     # запас больше этого числа дней продаж считается излишком
new_arrival_days = 30    # товар без продаж, лежащий меньше этого срока, считается новым приходом, а не неликвидом
exclude_stores = ["брак"]   # склады, в названии которых есть эти слова, не участвуют в анализе закупа и перемещениях

[transfers]
deficit_days = 14        # на складе/ангаре запаса меньше N дней продаж — дефицит
surplus_days = 120       # запаса больше N дней продаж (или продаж нет вовсе) — можно забирать
target_days = 30         # до какого запаса пополнять склад с дефицитом
keep_days = 60           # сколько дней запаса оставлять складу-донору

[documents]
orders_lookback_days = 365   # за какой период смотреть заказы поставщикам
closed_states = ["полный келди"]   # статусы заказа поставщику, при которых заказ считается закрытым
payments_days = 90           # за какой период показывать реестр платежей заводам

[files]
logistics = "input/logistics.xlsx"   # ручной ввод логистики (создаётся автоматически)
reports_dir = "reports"
