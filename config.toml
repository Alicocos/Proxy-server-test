# Настройки отчёта. Меняйте цифры под свою реальность — от них зависят все рекомендации.

[purchase]
lead_time_days = 45      # срок от заказа заводу до прихода на склад (производство + Китай + внешняя логистика)
safety_days = 14         # страховой запас на задержки
order_cycle_days = 30    # как часто вы размещаете заказы (на сколько дней берём товар сверх срока поставки)
overstock_days = 180     # запас больше этого числа дней продаж считается излишком
new_arrival_days = 30    # товар без продаж, лежащий меньше этого срока, считается новым приходом, а не неликвидом
exclude_stores = ["брак"]   # склады, в названии которых есть эти слова, не участвуют в анализе закупа и перемещениях

[transfers]
deficit_days = 14        # на складе/ангаре запаса меньше N дней продаж — дефицит
surplus_days = 120       # запаса больше N дней продаж (или продаж нет вовсе) — можно забирать
target_days = 30         # до какого запаса пополнять склад с дефицитом
keep_days = 60           # сколько дней запаса оставлять складу-донору

[suppliers]
tags = ["поставщики китай", "поставщик завод"]   # группы контрагентов в МойСклад, которые считаются заводами
payments_days = 90        # за какой период показывать реестр платежей заводам
stale_days = 60           # предоплата есть, а приёмок не было дольше N дней — «деньги без движения»

[orders]
since = "2026-11-13"       # читаются заказы поставщикам, ЗАВЕДЁННЫЕ в МойСклад начиная с этой даты (дата самого заказа может быть раньше)
closed_states = []   # статусы, при которых заказ считается закрытым. Пусто: статус не важен — проведённый заказ считается «в пути», непроведённый не учитывается

[logistics]
expense_items = ["Доставка", "Доставка завод"]   # статьи расходов МойСклад, которые считаются логистикой

[bazaar]
agents = ["Строи сити"]   # контрагенты-базар: отгрузка им — это передача товара в ангары, а не конечная продажа

[sales]
# Группы клиентов для отчёта по продажам: название в отчёте и тег контрагента в МойСклад. Порядок важен:
# клиент попадает в первую группу, тег которой у него есть.
groups = [
  { name = "Сержан клиенты", tag = "сержан клиент" },
  { name = "Данияр клиенты", tag = "данияр клиент" },
  { name = "Алдияр клиенты", tag = "алдияр клиенты" },
  { name = "Строи сити (базар)", tag = "базар" },
  { name = "Общие клиенты", tag = "клиенты" },
]

[files]
timezone = "Asia/Almaty"            # время отчёта и «сегодня» для расчётов просрочек
logistics = "input/logistics.xlsx"   # ручной ввод логистики (создаётся автоматически)
reports_dir = "reports"
